<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Risk-Aware AI Refund Platform</title>
<style>
  :root{
    --bg:#f5f7fb; --panel:#ffffff; --text:#152033; --muted:#6e7787;
    --primary:#3b66f5; --primary2:#7347e8; --line:#e6eaf1; --success:#1f9d66;
    --success-soft:#eaf8f1; --warn:#c98518; --warn-soft:#fff6df; --danger:#c54d54;
    --danger-soft:#fff0f1; --shadow:0 16px 40px rgba(28,44,72,.09);
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text)}
  button,input,textarea,select{font:inherit}
  body{min-height:100vh}
  .app{max-width:1320px;margin:0 auto;padding:28px 22px 48px}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:22px}
  .brand{display:flex;align-items:center;gap:14px}
  .logo{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,var(--primary),var(--primary2));display:grid;place-items:center;color:#fff;font-weight:800;box-shadow:0 10px 24px rgba(65,85,210,.28)}
  h1{font-size:24px;margin:0 0 4px;letter-spacing:-.02em}.subtitle{color:var(--muted);font-size:14px}
  .status-pill{background:#fff;border:1px solid var(--line);border-radius:999px;padding:9px 13px;color:#43516b;font-size:13px;box-shadow:0 6px 18px rgba(30,44,70,.05)}

  .progress-wrap{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow);margin-bottom:22px;overflow-x:auto}
  .progress{display:flex;align-items:center;min-width:980px}
  .step{display:flex;align-items:center;gap:10px;cursor:pointer;flex:1;position:relative}
  .step:not(:last-child)::after{content:"";height:2px;background:#dfe5ef;position:absolute;left:44px;right:6px;top:18px;z-index:0}
  .step.done:not(:last-child)::after,.step.active:not(:last-child)::after{background:linear-gradient(90deg,var(--primary),#98aafb)}
  .step-num{width:36px;height:36px;border-radius:50%;border:2px solid #d8deea;background:#fff;display:grid;place-items:center;font-weight:700;color:#7c8799;z-index:1;transition:.2s}
  .step.active .step-num{border-color:var(--primary);background:var(--primary);color:#fff;box-shadow:0 0 0 5px rgba(59,102,245,.10)}
  .step.done .step-num{border-color:var(--success);background:var(--success);color:#fff}
  .step-label{z-index:1;background:#fff;padding-right:8px;line-height:1.15}
  .step-label b{font-size:13px;display:block}.step-label span{font-size:11px;color:var(--muted)}

  .screen{display:none}.screen.active{display:block;animation:fade .22s ease}
  @keyframes fade{from{opacity:.35;transform:translateY(4px)}to{opacity:1;transform:none}}
  .grid{display:grid;grid-template-columns:1.15fr .85fr;gap:20px}
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
  .panel-head{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;background:linear-gradient(#fff,#fbfcfe)}
  .panel-head h2{margin:0;font-size:18px}.eyebrow{font-size:12px;color:var(--primary);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
  .panel-body{padding:20px}
  .field{margin-bottom:16px}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}.field small{color:var(--muted)}
  select,input[type=text],textarea{width:100%;border:1px solid #dbe1eb;border-radius:11px;padding:11px 12px;background:#fff;outline:none;transition:.15s}
  select:focus,input:focus,textarea:focus{border-color:#8aa3ff;box-shadow:0 0 0 4px rgba(59,102,245,.09)}
  textarea{min-height:112px;resize:vertical}
  .upload{border:2px dashed #cfd7e6;border-radius:14px;padding:22px;text-align:center;background:#fafbfe;cursor:pointer;transition:.2s;position:relative}
  .upload:hover,.upload.drag{border-color:var(--primary);background:#f4f7ff}.upload input{display:none}
  .upload-icon{font-size:28px;margin-bottom:8px}.upload-title{font-weight:700}.upload-sub{font-size:12px;color:var(--muted);margin-top:4px}
  .thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}.thumb{aspect-ratio:1/1;border-radius:10px;object-fit:cover;width:100%;border:1px solid var(--line)}
  .summary-card{display:flex;gap:14px;align-items:center;padding:14px;background:#f8faff;border-radius:14px;border:1px solid #e6ebf5}
  .product-art{width:78px;height:78px;border-radius:12px;background:linear-gradient(135deg,#d8e3ff,#eef2ff);display:grid;place-items:center;font-size:32px}
  .kv{display:grid;grid-template-columns:130px 1fr;gap:9px;font-size:13px}.kv div:nth-child(odd){color:var(--muted)}
  .btn-row{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}.btn{border:0;border-radius:11px;padding:11px 16px;font-weight:700;cursor:pointer;transition:.15s}
  .btn.primary{background:linear-gradient(135deg,var(--primary),#5d63e8);color:#fff;box-shadow:0 9px 22px rgba(59,102,245,.24)}.btn.primary:hover{transform:translateY(-1px)}
  .btn.ghost{background:#fff;border:1px solid #dbe1eb;color:#354057}.btn.success{background:var(--success);color:#fff}
  .btn.warn{background:#fff1d6;color:#8a5d0d;border:1px solid #f1d695}
  .badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 9px;background:#eef3ff;color:#4760b8;font-size:12px;font-weight:700}

  .analysis-hero{display:grid;grid-template-columns:170px 1fr;gap:18px;align-items:center}.preview-box{height:170px;border-radius:14px;background:linear-gradient(145deg,#eef2f8,#dfe5ef);display:grid;place-items:center;font-size:48px;overflow:hidden}.preview-box img{width:100%;height:100%;object-fit:cover}
  .metric{margin:13px 0}.metric-top{display:flex;justify-content:space-between;font-size:12px;margin-bottom:6px}.bar{height:8px;border-radius:99px;background:#e8edf5;overflow:hidden}.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--primary),#8c64ed);width:0;transition:width .7s ease}
  .info-box{border:1px solid var(--line);border-radius:14px;padding:15px;background:#fbfcff;margin-bottom:14px}.info-box h3{margin:0 0 8px;font-size:14px}.info-box p{margin:0;color:#526077;font-size:13px;line-height:1.55}
  .analysis-summary{background:#f7faff;border-left:4px solid var(--primary);padding:14px 15px;border-radius:10px;font-size:13px;line-height:1.55}

  .accordion{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:10px}.acc-head{padding:13px 14px;background:#fbfcfe;display:flex;justify-content:space-between;cursor:pointer;font-weight:700;font-size:13px}.acc-body{padding:0 14px;max-height:0;overflow:hidden;color:#56637a;font-size:13px;line-height:1.55;transition:.25s}.accordion.open .acc-body{padding:12px 14px 14px;max-height:180px;border-top:1px solid var(--line)}

  .score-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.score-card{border:1px solid var(--line);border-radius:18px;padding:18px;background:#fff}.score-card h3{font-size:14px;margin:0 0 14px}.ring-row{display:flex;align-items:center;gap:18px}.ring{--v:78;--c:var(--primary);width:124px;height:124px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--v)*1%), #e9edf4 0);position:relative;display:grid;place-items:center;flex:0 0 auto}.ring::after{content:"";position:absolute;inset:12px;border-radius:50%;background:#fff}.ring .center{z-index:1;text-align:center}.ring strong{font-size:24px;display:block}.ring small{color:var(--muted)}
  .factor-list{flex:1}.factor-row{display:grid;grid-template-columns:1fr 52px;gap:10px;align-items:center;margin-bottom:9px;font-size:12px}.factor-row input{width:100%}.factor-row output{text-align:right;font-weight:700;color:#43516a}
  input[type=range]{accent-color:var(--primary)}
  .interpret{margin-top:14px;border-radius:12px;padding:12px 13px;font-size:12px}.interpret.blue{background:#edf4ff;color:#39598f}.interpret.green{background:#ebf8f1;color:#3a7255}.interpret.amber{background:#fff4dc;color:#8a6223}

  .decision{padding:28px;text-align:center;border-radius:18px;border:1px solid var(--line);background:linear-gradient(135deg,#f4fbf7,#effaf4)}
  .decision.review{background:linear-gradient(135deg,#fff8e9,#fff3d7)}.decision.more{background:linear-gradient(135deg,#f4f7ff,#eef0ff)}
  .decision-icon{width:64px;height:64px;border-radius:50%;margin:0 auto 12px;display:grid;place-items:center;background:var(--success);color:#fff;font-size:30px;font-weight:800}.decision.review .decision-icon{background:var(--warn)}.decision.more .decision-icon{background:var(--primary)}
  .decision h2{margin:5px 0 7px;font-size:29px}.decision p{margin:0;color:#56637b}
  .factor-chips{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:16px}.chip{border:1px solid #dce2eb;background:#fff;border-radius:999px;padding:7px 10px;font-size:12px;color:#44516a}

  .tabs{display:flex;gap:7px;border-bottom:1px solid var(--line);margin-bottom:15px}.tab{padding:9px 12px;cursor:pointer;font-size:12px;font-weight:700;border-bottom:2px solid transparent}.tab.active{border-color:var(--primary);color:var(--primary)}.tabpane{display:none}.tabpane.active{display:block}
  .radio-list label{display:flex;align-items:center;gap:9px;padding:10px 11px;border:1px solid var(--line);border-radius:10px;margin-bottom:9px;cursor:pointer;background:#fff}.radio-list label:has(input:checked){border-color:#9fb0ff;background:#f4f6ff}
  .toast{position:fixed;right:24px;bottom:24px;background:#14233a;color:#fff;border-radius:12px;padding:13px 16px;box-shadow:0 14px 35px rgba(0,0,0,.2);opacity:0;transform:translateY(10px);pointer-events:none;transition:.25s;z-index:20}.toast.show{opacity:1;transform:none}
  .helper{display:flex;align-items:center;gap:8px;font-size:12px;color:#657289;margin-top:8px}.dot{width:8px;height:8px;border-radius:50%;background:var(--success)}
  .empty-img{width:100%;height:170px;border:1px dashed #cdd5e2;border-radius:12px;background:#fafbfe;display:grid;place-items:center;color:#8d98aa}
  .footer-note{color:#8a93a3;font-size:12px;text-align:center;margin-top:18px}
  @media(max-width:900px){.grid,.grid-2,.score-grid{grid-template-columns:1fr}.analysis-hero{grid-template-columns:1fr}.topbar{align-items:flex-start;flex-direction:column}.status-pill{align-self:flex-start}}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand">
      <div class="logo">RA</div>
      <div><h1>Risk-Aware AI Refund Platform</h1><div class="subtitle">Customer submission · Evidence analysis · Policy verification · Explainable decision</div></div>
    </div>
    <div class="status-pill">● Prototype mode · No real refund is processed</div>
  </div>

  <div class="progress-wrap"><div class="progress" id="progress"></div></div>
  <main id="screens"></main>
  <div class="footer-note">Research prototype for demonstration only. Mock data is used and no real refund is processed.</div>
</div>
<div class="toast" id="toast"></div>

<script>
const state={
  current:1, maxVisited:1, reason:'', description:'', files:[],
  order:{id:'ORD001',product:'Black Jacket',price:'$129.00',date:'2026-08-01',status:'Delivered',category:'Jacket',image:null,retailer:'H&M Australia'},
  orders:[], demoImage:false,
  backend:null,
  confidence:.78, risk:.30, factors:{quality:.70,auth:.75,consistency:.85,complete:.80,order:.75},
  decision:'Auto Refund'
};
const steps=[
  ['Submit','Refund Request'],['Evidence','Analysis'],['Information','Retrieval'],['Risk & Evidence','Assessment'],['Decision','Result'],['Human Review','Optional']
];
const $=s=>document.querySelector(s);
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}
function renderProgress(){
 const p=$('#progress');p.innerHTML='';
 steps.forEach((s,i)=>{const n=i+1;const el=document.createElement('div');el.className='step '+(n<state.current?'done':n===state.current?'active':'');el.innerHTML=`<div class="step-num">${n<state.current?'✓':n}</div><div class="step-label"><b>${n}. ${s[0]}</b><span>${s[1]}</span></div>`;el.onclick=()=>{if(n<=state.maxVisited || n===6){goto(n)}};p.appendChild(el)})
}
function goto(n){state.current=n;state.maxVisited=Math.max(state.maxVisited,n);renderProgress();document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));$('#screen'+n).classList.add('active');window.scrollTo({top:0,behavior:'smooth'});if(n===2)animateBars();if(n===3)showBackendResults();if(n===4)recompute();if(n===5){renderDecision();showBackendDecision()}}
async function next(){if(state.current===2){await runBackend();return}if(state.current<6)goto(state.current+1)}
function back(){if(state.current>1)goto(state.current-1)}
async function runBackend(){
 const payload={case_id:'UI-DEMO-001',order_id:state.order.id,claim_text:state.description||'The garment arrived with visible damage.',detected_product:state.order.category,damage_type:state.description.toLowerCase().includes('stain')?'stain_or_spot':'hole_or_tear',image_present:state.files.length>0||state.demoImage,image_usable:true,image_quality:.90,damage_confidence:.88,claim_image_consistency:.92,request_date:'2026-08-15'};
 toast('Running Python retrieval and verification...');
 try{
  const response=await fetch('/api/evidence',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
  const result=await response.json();
  if(!response.ok)throw new Error(result.error||'Backend request failed');
  state.backend=result;
  if(result.order)state.order={id:result.order.order_id,product:result.order.product_name,price:'$'+result.order.price.toFixed(2),date:result.order.purchase_date,status:result.order.status,category:result.order.product_category};
  goto(3);showBackendResults();
 }catch(error){toast(error.message+' — restart the app server')}
}
function showBackendResults(){
 if(!state.backend)return;
 const b=state.backend,e=b.evidence,p=b.policy,o=b.order;
 const bodies=document.querySelectorAll('#screen3 .panel-body');
 if(bodies[0])bodies[0].innerHTML=`<div class="kv"><div>Order ID</div><div>${o?o.order_id:'Not found'}</div><div>Product</div><div>${o?o.product_name:'—'}</div><div>Price</div><div>${o?'$'+o.price.toFixed(2):'—'}</div><div>Status</div><div>${o?o.status:'—'}</div></div><div class="info-box" style="margin-top:18px"><h3>Live Python result</h3><p>Order valid: <b>${e.order_valid}</b><br>Image-order consistency: <b>${e.image_order_consistency}</b><br>Evidence completeness: <b>${e.evidence_completeness}</b></p></div>`;
 if(bodies[1])bodies[1].innerHTML=`<div class="info-box"><h3>${p?p.title:'No policy retrieved'}</h3><p>${p?p.policy_text:b.reason}</p></div><div class="kv"><div>Policy ID</div><div>${p?p.policy_id:'—'}</div><div>Policy match</div><div>${e.policy_match_score}</div><div>Eligible</div><div>${e.policy_eligible}</div><div>Source</div><div>${e.policy_source||'—'}</div></div><div class="analysis-summary" style="margin-top:16px"><b>Verification feedback:</b> ${b.reason}</div>`;
}
function showBackendDecision(){
 if(!state.backend)return;
 const d=state.backend.decision,box=document.querySelector('#decisionBox');
 const cls=d.decision==='HUMAN_REVIEW'?'review':d.decision==='REQUEST_MORE_EVIDENCE'?'more':'';
 const icon=d.decision==='AUTO_REFUND'?'✓':'!';
 box.innerHTML=`<div class="decision ${cls}"><div class="decision-icon">${icon}</div><div class="eyebrow">Live Python recommendation</div><h2>${d.decision.replaceAll('_',' ')}</h2><p>${d.reason}</p><div class="factor-chips"><span class="chip">Evidence ${d.evidence_confidence}</span><span class="chip">Risk ${d.refund_risk}</span><span class="chip">Policy ${state.backend.evidence.policy_eligible?'Eligible':'Not eligible'}</span></div></div>`;
 $('#dConf').textContent=d.evidence_confidence+' · calculated';
 $('#dRisk').textContent=d.refund_risk+' · calculated';
}
async function loadOrderDatabase(){
 try{
  const response=await fetch('/api/orders'); const data=await response.json();
  if(!response.ok)throw new Error(data.error||'Could not load orders');
  state.orders=data.orders;
  const list=$('#orderOptions'); if(list)list.innerHTML=state.orders.map(o=>`<option value="${o.order_id}">${o.product_name}</option>`).join('');
  selectOrder('ORD001');
 }catch(error){toast(error.message)}
}
function selectOrder(id){
 const o=state.orders.find(x=>x.order_id===id.toUpperCase()); if(!o)return;
 state.order={id:o.order_id,product:o.product_name,price:'$'+o.price.toFixed(2),date:o.purchase_date,status:o.status,category:o.product_category,image:o.image_evidence,retailer:o.retailer};
 state.demoImage=false;
 const card=$('#selectedOrder'); if(card)card.innerHTML=`<b>${o.product_name}</b><br><small>${o.retailer} · ${o.data_type} · ${o.status}</small>`;
 const button=$('#useDemo'); if(button){button.disabled=!o.image_evidence;button.textContent=o.image_evidence?'Use linked demo photo':'No linked demo photo — upload your own';}
}
function useDemoImage(){
 if(!state.order.image)return; state.demoImage=true;
 const path='/'+state.order.image.image_path; $('#thumbs').innerHTML=`<img class="thumb" src="${path}" alt="Traceable demonstration garment">`;
 toast('Linked CC BY 4.0 demo image selected');
}
function mount(){
 $('#screens').innerHTML = step1()+step2()+step3()+step4()+step5()+step6();
 bind(); renderProgress(); goto(1); loadOrderDatabase();
}
function step1(){return `<section class="screen" id="screen1"><div class="grid">
 <div class="panel"><div class="panel-head"><div><div class="eyebrow">Step 1</div><h2>Submit Refund Request</h2></div><span class="badge">Customer portal</span></div><div class="panel-body">
   <div class="field"><label>Order ID</label><input type="text" id="orderId" list="orderOptions" value="ORD001"><datalist id="orderOptions"></datalist><div id="selectedOrder" class="helper">Loading 70 traceable synthetic order records…</div></div>
   <div class="field"><label>Refund reason</label><select id="reason"><option value="">Select a reason</option><option>Product arrived damaged</option><option>Wrong item received</option><option>Item not as described</option><option>Missing parts / accessories</option><option>Changed my mind</option></select></div>
   <div class="field"><label>Please describe your issue</label><textarea id="desc" placeholder="Example: The jacket arrived with a visible tear on the left sleeve."></textarea></div>
   <div class="field"><label>Evidence image</label><button type="button" class="btn ghost" id="useDemo" onclick="useDemoImage()">Use linked demo photo</button><label class="upload" id="drop" style="margin-top:10px"><input id="fileInput" type="file" accept="image/*" multiple><div class="upload-icon">🖼️</div><div class="upload-title">Or upload your own image</div><div class="upload-sub">JPG, PNG · up to 6 files for this prototype</div></label><div class="thumbs" id="thumbs"></div></div>
   <div class="btn-row"><button class="btn primary" id="submitReq">Submit request →</button></div>
 </div></div>
 <div class="panel"><div class="panel-head"><div><div class="eyebrow">Order</div><h2>Order Summary</h2></div><span class="badge">Verified</span></div><div class="panel-body">
   <div class="summary-card"><div class="product-art">🧥</div><div><b>Classic Jacket</b><div class="helper"><span class="dot"></span>Delivered</div><div style="margin-top:8px;font-size:13px;color:#66728a">Order ${state.order.id}</div></div></div>
   <div class="kv" style="margin-top:18px"><div>Purchase date</div><div>${state.order.date}</div><div>Price</div><div>${state.order.price}</div><div>Category</div><div>${state.order.category}</div><div>Refund window</div><div>Eligible</div></div>
   <div class="info-box" style="margin-top:18px"><h3>Why evidence helps</h3><p>Clear photos and a specific claim help the system compare the evidence with order data and refund policy before suggesting a decision.</p></div>
 </div></div></div></section>`}
function step2(){return `<section class="screen" id="screen2"><div class="panel"><div class="panel-head"><div><div class="eyebrow">Step 2</div><h2>Evidence Analysis</h2></div><span class="badge">Multimodal AI · simulated</span></div><div class="panel-body">
 <div class="grid-2"><div>
   <div class="info-box"><h3>Claim understanding</h3><div class="kv"><div>Issue</div><div id="claimIssue">Product arrived damaged</div><div>Detected defect</div><div>Tear / hole</div><div>Likely location</div><div>Left sleeve</div></div></div>
   <div class="analysis-hero"><div class="preview-box" id="analysisPreview">🖼️</div><div>
      <div class="metric"><div class="metric-top"><span>Defect detected</span><b>High</b></div><div class="bar"><i data-w="88"></i></div></div>
      <div class="metric"><div class="metric-top"><span>Claim–image consistency</span><b>High</b></div><div class="bar"><i data-w="85"></i></div></div>
      <div class="metric"><div class="metric-top"><span>Image quality</span><b>Medium–High</b></div><div class="bar"><i data-w="70"></i></div></div>
      <div class="metric"><div class="metric-top"><span>Image authenticity</span><b>Medium–High</b></div><div class="bar"><i data-w="75"></i></div></div>
   </div></div>
 </div><div>
   <div class="info-box"><h3>AI analysis summary</h3><p id="analysisText">The uploaded evidence appears consistent with the refund claim. A visible product defect is detected and no obvious manipulation signal is found.</p></div>
   <div class="analysis-summary"><b>Confidence note:</b> This step estimates evidence quality and consistency. It does not make the refund decision on its own.</div>
   <div class="btn-row"><button class="btn ghost" onclick="animateBars();toast('Evidence analysis re-run')">↻ Re-run analysis</button></div>
 </div></div>
 <div class="btn-row"><button class="btn ghost" onclick="back()">← Back</button><button class="btn primary" onclick="next()">Retrieve information →</button></div>
 </div></div></section>`}
function step3(){return `<section class="screen" id="screen3"><div class="grid">
 <div class="panel"><div class="panel-head"><div><div class="eyebrow">Step 3</div><h2>Order Information</h2></div><span class="badge">Order database</span></div><div class="panel-body"><div class="kv"><div>Order ID</div><div>${state.order.id}</div><div>Product</div><div>${state.order.product}</div><div>Price</div><div>${state.order.price}</div><div>Purchase date</div><div>${state.order.date}</div><div>Status</div><div>${state.order.status}</div></div><div class="info-box" style="margin-top:18px"><h3>Consistency check</h3><p>Claimed product and order record match. Purchase date is within the standard return window.</p></div></div></div>
 <div class="panel"><div class="panel-head"><div><div class="eyebrow">RAG</div><h2>Relevant Refund Policies</h2></div><span class="badge">4 sources retrieved</span></div><div class="panel-body">
   ${acc('Damaged Item Policy','If an item arrives damaged or defective, the customer may be eligible for a return or refund when sufficient evidence supports the claim.',true)}
   ${acc('Return Window Policy','Standard items are generally eligible within the configured return window, subject to category-specific exclusions.')}
   ${acc('Evidence Requirements','Clear images should show the product, relevant defect, and enough context to associate the evidence with the purchased item.')}
   ${acc('High-Value Refund Policy','Higher-value or high-risk claims may require additional evidence or manual review before a refund is processed.')}
   <div class="helper"><span class="dot"></span>Policy source: Refund Policy Knowledge Base</div>
 </div></div></div><div class="btn-row"><button class="btn ghost" onclick="back()">← Back</button><button class="btn primary" onclick="next()">Assess risk & evidence →</button></div></section>`}
function acc(title,body,open=false){return `<div class="accordion ${open?'open':''}"><div class="acc-head">${title}<span>⌄</span></div><div class="acc-body">${body}</div></div>`}
function step4(){return `<section class="screen" id="screen4"><div class="panel"><div class="panel-head"><div><div class="eyebrow">Step 4</div><h2>Risk & Evidence Assessment</h2></div><span class="badge">Decision features</span></div><div class="panel-body"><div class="score-grid">
 <div class="score-card"><h3>Evidence Confidence</h3><div class="ring-row"><div class="ring" id="confRing" style="--v:78;--c:#3b66f5"><div class="center"><strong id="confVal">0.78</strong><small id="confLabel">High</small></div></div><div class="factor-list">
  ${slider('Image quality','quality',70)}${slider('Image authenticity','auth',75)}${slider('Claim-image consistency','consistency',85)}${slider('Evidence completeness','complete',80)}${slider('Order consistency','order',75)}
 </div></div><div class="interpret blue" id="confInterpret">Available evidence is relatively reliable for supporting the claim.</div></div>
 <div class="score-card"><h3>Refund Risk</h3><div class="ring-row"><div class="ring" id="riskRing" style="--v:30;--c:#c98518"><div class="center"><strong id="riskVal">0.30</strong><small id="riskLabel">Low</small></div></div><div class="factor-list">
   <div class="info-box"><h3>Risk inputs</h3><div class="kv"><div>Refund amount</div><div>${state.order.price}</div><div>Product category</div><div>${state.order.category}</div><div>Claim history</div><div>Normal</div><div>Policy fit</div><div>Strong</div></div></div>
 </div></div><div class="interpret green" id="riskInterpret">Low financial and behavioural risk if the refund is approved.</div></div>
 </div><div class="btn-row"><button class="btn ghost" onclick="back()">← Back</button><button class="btn primary" onclick="next()">Generate decision →</button></div></div></div></section>`}
function slider(label,key,val){return `<div class="factor-row"><div><div style="display:flex;justify-content:space-between;margin-bottom:3px"><span>${label}</span><output id="o_${key}">${(val/100).toFixed(2)}</output></div><input type="range" min="0" max="100" value="${val}" data-factor="${key}"></div><span></span></div>`}
function step5(){return `<section class="screen" id="screen5"><div class="panel"><div class="panel-head"><div><div class="eyebrow">Step 5</div><h2>Decision Result</h2></div><span class="badge">AI recommendation</span></div><div class="panel-body"><div id="decisionBox"></div><div class="grid-2" style="margin-top:18px"><div class="info-box"><h3>Key factors</h3><div class="kv"><div>Evidence confidence</div><div id="dConf">0.78 · High</div><div>Refund risk</div><div id="dRisk">0.30 · Low</div><div>Policy eligibility</div><div>Eligible</div></div></div><div class="info-box"><h3>Next step</h3><p id="nextText">The refund can be processed automatically. A human reviewer can still inspect the evidence if needed.</p></div></div><div class="btn-row"><button class="btn ghost" onclick="back()">← Back</button><button class="btn warn" onclick="goto(6)">Open human review</button><button class="btn primary" onclick="toast('Prototype action completed — no real refund was processed')">Confirm recommended action</button></div></div></div></section>`}
function step6(){return `<section class="screen" id="screen6"><div class="grid">
 <div class="panel"><div class="panel-head"><div><div class="eyebrow">Step 6</div><h2>Human Review</h2></div><span class="badge">Optional · Human-in-the-loop</span></div><div class="panel-body"><div class="info-box" id="aiRec"><h3>AI recommendation</h3><p><b>Recommended action:</b> Auto Refund<br>Evidence confidence: 0.78 · Refund risk: 0.30</p></div>
 <div class="tabs"><div class="tab active" data-tab="images">Images</div><div class="tab" data-tab="claim">Claim</div><div class="tab" data-tab="order">Order Info</div><div class="tab" data-tab="policies">Policies</div></div>
 <div class="tabpane active" id="tab-images"><div id="reviewImgs"><div class="empty-img">No uploaded image — prototype placeholder</div></div></div>
 <div class="tabpane" id="tab-claim"><div class="info-box"><h3>Customer claim</h3><p id="reviewClaim">Product arrived damaged. Visible tear on the sleeve.</p></div></div>
 <div class="tabpane" id="tab-order"><div class="info-box"><h3>Order record</h3><p>${state.order.product} · ${state.order.price} · purchased ${state.order.date} · status ${state.order.status}</p></div></div>
 <div class="tabpane" id="tab-policies"><div class="info-box"><h3>Policy summary</h3><p>Damaged items with sufficient evidence are eligible for refund. High-risk or uncertain cases should be manually reviewed.</p></div></div>
 </div></div>
 <div class="panel"><div class="panel-head"><div><div class="eyebrow">Reviewer</div><h2>Decision</h2></div></div><div class="panel-body"><div class="radio-list"><label><input type="radio" name="review" value="Approve (Auto Refund)" checked> Approve (Auto Refund)</label><label><input type="radio" name="review" value="Request More Evidence"> Request More Evidence</label><label><input type="radio" name="review" value="Escalate to Specialist"> Escalate to Specialist</label><label><input type="radio" name="review" value="Reject Refund"> Reject Refund</label></div><div class="field"><label>Reviewer notes <small>(optional)</small></label><textarea id="reviewNotes" placeholder="Add review rationale..."></textarea></div><div class="btn-row"><button class="btn ghost" onclick="back()">← Back</button><button class="btn success" id="submitReview">Submit decision</button></div></div></div>
 </div></section>`}
function bind(){
 $('#reason').addEventListener('change',e=>state.reason=e.target.value);$('#desc').addEventListener('input',e=>state.description=e.target.value);$('#orderId').addEventListener('change',e=>selectOrder(e.target.value.trim()));
 const drop=$('#drop'),inp=$('#fileInput');drop.addEventListener('dragover',e=>{e.preventDefault();drop.classList.add('drag')});drop.addEventListener('dragleave',()=>drop.classList.remove('drag'));drop.addEventListener('drop',e=>{e.preventDefault();drop.classList.remove('drag');handleFiles(e.dataTransfer.files)});inp.addEventListener('change',e=>handleFiles(e.target.files));
 $('#submitReq').onclick=()=>{state.reason=$('#reason').value;state.description=$('#desc').value;if(!state.reason){toast('Please select a refund reason first');return;}goto(2);syncClaim()};
 document.querySelectorAll('.acc-head').forEach(h=>h.onclick=()=>h.parentElement.classList.toggle('open'));
 document.querySelectorAll('[data-factor]').forEach(r=>r.addEventListener('input',()=>{const k=r.dataset.factor;state.factors[k]=r.value/100;$('#o_'+k).value=state.factors[k].toFixed(2);recompute()}));
 document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.tabpane').forEach(x=>x.classList.remove('active'));t.classList.add('active');$('#tab-'+t.dataset.tab).classList.add('active')});
 $('#submitReview').onclick=()=>{const choice=document.querySelector('input[name=review]:checked').value;toast('Reviewer decision submitted: '+choice)};
}
function handleFiles(fileList){state.demoImage=false;state.files=[...fileList].slice(0,6);const thumbs=$('#thumbs');thumbs.innerHTML='';state.files.forEach(f=>{const img=document.createElement('img');img.className='thumb';img.src=URL.createObjectURL(f);thumbs.appendChild(img)});updatePreview();}
function updatePreview(){if(state.files[0]){const u=URL.createObjectURL(state.files[0]);$('#analysisPreview').innerHTML=`<img src="${u}">`;$('#reviewImgs').innerHTML='<div class="thumbs" style="grid-template-columns:repeat(3,1fr)"></div>';const box=$('#reviewImgs .thumbs');state.files.forEach(f=>{const i=document.createElement('img');i.className='thumb';i.src=URL.createObjectURL(f);box.appendChild(i)})}}
function syncClaim(){const r=state.reason||'Product arrived damaged';$('#claimIssue').textContent=r;$('#reviewClaim').textContent=(state.description||r)+'.'; if(r.includes('Changed')){$('#analysisText').textContent='No physical defect claim was supplied. Visual evidence is treated as optional and the policy fit becomes the main decision signal.'}}
function animateBars(){setTimeout(()=>document.querySelectorAll('#screen2 .bar i').forEach(i=>i.style.width=i.dataset.w+'%'),70)}
function recompute(){
 const f=state.factors;state.confidence=(f.quality+f.auth+f.consistency+f.complete+f.order)/5;
 // risk rises as evidence weakens, but keeps a base transaction risk
 state.risk=Math.max(.12,Math.min(.88,.17 + (1-state.confidence)*.48 + (state.order.price.includes('120')?.03:.12)));
 $('#confVal').textContent=state.confidence.toFixed(2);$('#riskVal').textContent=state.risk.toFixed(2);$('#confRing').style.setProperty('--v',(state.confidence*100).toFixed(0));$('#riskRing').style.setProperty('--v',(state.risk*100).toFixed(0));
 const cl=state.confidence>=.7?'High':state.confidence>=.5?'Medium':'Low';const rl=state.risk<=.4?'Low':state.risk<=.65?'Medium':'High';$('#confLabel').textContent=cl;$('#riskLabel').textContent=rl;
 $('#confInterpret').textContent=state.confidence>=.7?'Available evidence is relatively reliable for supporting the claim.':state.confidence>=.5?'Evidence is usable but has some uncertainty.':'Evidence is too weak for a confident automated decision.';
 $('#riskInterpret').textContent=state.risk<=.4?'Low financial and behavioural risk if the refund is approved.':state.risk<=.65?'Moderate refund risk; additional checks may be useful.':'High refund risk; human review is recommended.';
}
function renderDecision(){
 recompute(); let cls='',icon='✓',title='Auto Refund',reason='High evidence confidence and low refund risk support automatic approval.';
 if(state.confidence<.55){cls='more';icon='＋';title='Request More Evidence';reason='Evidence confidence is too low for a reliable refund decision.'}
 else if(state.risk>.45 || state.confidence<.70){cls='review';icon='!';title='Human Review';reason='The evidence or refund risk is uncertain enough to require human oversight.'}
 state.decision=title;$('#decisionBox').innerHTML=`<div class="decision ${cls}"><div class="decision-icon">${icon}</div><div class="eyebrow">Recommended action</div><h2>${title}</h2><p>${reason}</p><div class="factor-chips"><span class="chip">Evidence ${state.confidence.toFixed(2)}</span><span class="chip">Risk ${state.risk.toFixed(2)}</span><span class="chip">Policy match: Strong</span></div></div>`;
 $('#dConf').textContent=`${state.confidence.toFixed(2)} · ${state.confidence>=.7?'High':state.confidence>=.5?'Medium':'Low'}`;$('#dRisk').textContent=`${state.risk.toFixed(2)} · ${state.risk<=.4?'Low':state.risk<=.65?'Medium':'High'}`;
 $('#nextText').textContent=title==='Auto Refund'?'The refund can be processed automatically. A human reviewer can still inspect the evidence if needed.':title==='Request More Evidence'?'Ask the customer for clearer or additional evidence before making a final decision.':'Route the case to a human reviewer with the AI evidence summary and policy context.';
 $('#aiRec').innerHTML=`<h3>AI recommendation</h3><p><b>Recommended action:</b> ${title}<br>Evidence confidence: ${state.confidence.toFixed(2)} · Refund risk: ${state.risk.toFixed(2)}</p>`;
}
mount();
</script>
</body>
</html>
